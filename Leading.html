<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食現夢想家 | 溫馨手繪風</title>
    <!-- 引入可愛圓潤的字體以符合圖片風格 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'p-blue': '#82A3CB',      /* 主標題藍色 */
                        'p-yellow': '#FDE1A9',    /* 點綴黃色 */
                        'p-light-blue': '#C4D6ED',/* 淺藍色(翅膀等) */
                        'p-bg': '#FAFCFF',        /* 非常淺的藍白背景 */
                    },
                    fontFamily: {
                        'rounded': ['"M PLUS Rounded 1c"', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'float-fast': 'float 4s ease-in-out infinite',
                        'twinkle': 'twinkle 3s ease-in-out infinite',
                        'fly': 'fly 10s ease-in-out infinite',
                        'wiggle': 'wiggle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        twinkle: {
                            '0%, 100%': { opacity: '0.4', transform: 'scale(0.8)' },
                            '50%': { opacity: '1', transform: 'scale(1.2)' },
                        },
                        fly: {
                            '0%, 100%': { transform: 'translate(0, 0) rotate(-5deg)' },
                            '25%': { transform: 'translate(20px, -15px) rotate(5deg)' },
                            '50%': { transform: 'translate(10px, 10px) rotate(-5deg)' },
                            '75%': { transform: 'translate(-15px, -20px) rotate(0deg)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #FAFCFF;
            overflow-x: hidden;
        }
        /* 自定義手繪風筆觸效果 */
        .hand-drawn-border {
            border: 4px solid #82A3CB;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .btn-hover-effect:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(130, 163, 203, 0.2);
        }
    </style>
</head>
<body class="text-p-blue antialiased relative min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <nav class="w-full px-6 py-4 md:px-12 flex justify-between items-center relative z-20">
        <div class="flex items-center gap-2 cursor-pointer animate-wiggle">
            <!-- 簡易版螢火蟲 Logo -->
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" fill="#FDE1A9" opacity="0.3"/>
                <path d="M30 50C30 38.9543 38.9543 30 50 30C61.0457 30 70 38.9543 70 50C70 61.0457 61.0457 70 50 70C38.9543 70 30 61.0457 30 50Z" stroke="#82A3CB" stroke-width="6" stroke-linecap="round"/>
                <circle cx="42" cy="45" r="3" fill="#82A3CB"/>
                <circle cx="58" cy="45" r="3" fill="#82A3CB"/>
                <path d="M45 55Q50 60 55 55" stroke="#82A3CB" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <span class="text-xl md:text-2xl font-extrabold tracking-wider text-p-blue">食現夢想家</span>
        </div>
        <div class="hidden md:flex gap-8 font-bold text-lg">
            <a href="#" class="hover:text-p-yellow transition-colors relative group">
                關於我們
                <span class="absolute -bottom-2 left-0 w-0 h-1.5 bg-p-yellow rounded-full transition-all group-hover:w-full"></span>
            </a>
            <a href="#" class="hover:text-p-yellow transition-colors relative group">
                美味藍圖
                <span class="absolute -bottom-2 left-0 w-0 h-1.5 bg-p-yellow rounded-full transition-all group-hover:w-full"></span>
            </a>
            <a href="#" class="hover:text-p-yellow transition-colors relative group">
                加入行列
                <span class="absolute -bottom-2 left-0 w-0 h-1.5 bg-p-yellow rounded-full transition-all group-hover:w-full"></span>
            </a>
        </div>
        <button class="md:hidden text-p-blue p-2">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </nav>

    <!-- 主要視覺區 Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center relative px-4 py-20 overflow-hidden">
        
        <!-- 背景裝飾動畫 SVG 群組 -->
        <div class="absolute inset-0 z-0 pointer-events-none">
            <!-- 手繪雲朵 1 -->
            <div class="absolute top-10 right-10 md:top-20 md:right-32 animate-float">
                <svg width="180" height="120" viewBox="0 0 180 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 80 C20 80, 10 50, 40 40 C45 20, 80 10, 100 30 C120 10, 150 20, 150 45 C170 55, 160 80, 130 80 Z" stroke="#C4D6ED" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="white"/>
                    <line x1="150" y1="20" x2="160" y2="10" stroke="#C4D6ED" stroke-width="5" stroke-linecap="round"/>
                    <line x1="170" y1="40" x2="180" y2="35" stroke="#C4D6ED" stroke-width="5" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- 手繪雲朵 2 -->
            <div class="absolute bottom-32 left-0 md:bottom-20 md:left-20 animate-float-delayed">
                <svg width="140" height="100" viewBox="0 0 140 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M40 70 C15 70, 10 45, 30 35 C35 20, 60 10, 80 25 C95 10, 120 15, 120 35 C135 45, 130 70, 105 70 Z" stroke="#C4D6ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="transparent"/>
                    <path d="M10 50 Q 0 40 10 30" stroke="#C4D6ED" stroke-width="4" stroke-linecap="round" fill="transparent"/>
                </svg>
            </div>

            <!-- 主角：微笑螢火蟲 (根據參考圖重繪) -->
            <div class="absolute top-1/4 left-1/4 md:top-32 md:left-1/3 animate-fly z-10">
                <svg width="150" height="120" viewBox="0 0 150 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 發光尾巴 -->
                    <circle cx="105" cy="75" r="25" fill="#FDE1A9" class="animate-pulse" opacity="0.6"/>
                    <ellipse cx="95" cy="65" rx="15" ry="12" fill="#FDE1A9" transform="rotate(-30 95 65)"/>
                    <path d="M120 70 L130 70" stroke="#FDE1A9" stroke-width="4" stroke-linecap="round"/>
                    <path d="M115 85 L120 90" stroke="#FDE1A9" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- 翅膀 -->
                    <ellipse cx="65" cy="30" rx="25" ry="12" stroke="#82A3CB" stroke-width="5" fill="#C4D6ED" transform="rotate(-40 65 30)"/>
                    <ellipse cx="85" cy="35" rx="25" ry="12" stroke="#82A3CB" stroke-width="5" fill="white" transform="rotate(-10 85 35)"/>
                    
                    <!-- 身體 -->
                    <ellipse cx="70" cy="60" rx="20" ry="15" fill="#C4D6ED" stroke="#82A3CB" stroke-width="5" transform="rotate(-30 70 60)"/>
                    
                    <!-- 頭部 -->
                    <circle cx="45" cy="45" r="18" fill="white" stroke="#82A3CB" stroke-width="5"/>
                    <!-- 眼睛 -->
                    <circle cx="40" cy="42" r="2.5" fill="#82A3CB"/>
                    <circle cx="52" cy="42" r="2.5" fill="#82A3CB"/>
                    <!-- 微笑 -->
                    <path d="M42 48 Q 46 52 50 48" stroke="#82A3CB" stroke-width="3" stroke-linecap="round"/>
                    <!-- 觸角 -->
                    <path d="M35 30 Q 30 20 25 25" stroke="#82A3CB" stroke-width="4" stroke-linecap="round" fill="transparent"/>
                    <circle cx="25" cy="25" r="3" fill="#82A3CB"/>
                    <path d="M45 28 Q 45 15 55 18" stroke="#82A3CB" stroke-width="4" stroke-linecap="round" fill="transparent"/>
                    <circle cx="55" cy="18" r="3" fill="#82A3CB"/>
                </svg>
            </div>

            <!-- 星星與閃爍點綴 -->
            <div class="absolute top-1/3 right-1/4 animate-twinkle text-p-yellow">
                <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 2 L18 12 L28 15 L18 18 L15 28 L12 18 L2 15 L12 12 Z" fill="#FDE1A9"/>
                </svg>
            </div>
            <div class="absolute bottom-1/4 right-10 md:right-1/3 animate-twinkle" style="animation-delay: 1s;">
                <svg width="40" height="40" viewBox="0 0 30 30" fill="none" stroke="#FDE1A9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 2 L18 12 L28 15 L18 18 L15 28 L12 18 L2 15 L12 12 Z" fill="transparent"/>
                </svg>
            </div>
            <div class="absolute top-20 left-10 md:left-40 animate-float-fast text-p-yellow opacity-80">
                <svg width="25" height="25" viewBox="0 0 25 25" fill="none">
                    <polygon points="12.5,2 23,23 2,23" fill="#FDE1A9" stroke="#FDE1A9" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
            <!-- 小星球 -->
            <div class="absolute bottom-40 left-1/4 md:left-1/4 animate-float text-p-blue">
                <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
                    <circle cx="25" cy="25" r="10" stroke="#82A3CB" stroke-width="4" fill="transparent"/>
                    <ellipse cx="25" cy="25" rx="20" ry="6" stroke="#82A3CB" stroke-width="4" transform="rotate(-20 25 25)" fill="transparent"/>
                    <path d="M15 15 L18 18" stroke="#FDE1A9" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <!-- 中間文字區域 -->
        <div class="relative z-10 text-center flex flex-col items-center mt-20 md:mt-10">
            <!-- 標題設計 (還原圖片中的錯落感與黃色點綴) -->
            <div class="relative inline-block mb-6 md:mb-10">
                <!-- 標題裝飾黃色色塊 -->
                <div class="absolute -bottom-2 left-1/4 w-1/2 h-4 bg-p-yellow rounded-full -z-10 opacity-80 transform -rotate-2"></div>
                <div class="absolute top-1/2 right-12 w-16 h-16 bg-p-yellow rounded-full -z-10 opacity-80 transform -translate-y-1/2"></div>
                
                <h1 class="text-6xl md:text-8xl font-extrabold flex items-center justify-center gap-2 md:gap-4 flex-wrap">
                    <span class="relative animate-wiggle inline-block">
                        <span class="absolute -top-6 -left-4 text-4xl text-p-blue opacity-50">“</span>
                        食
                        <span class="absolute -top-6 -right-4 text-4xl text-p-blue opacity-50">”</span>
                    </span>
                    <span class="transform translate-y-2 inline-block">現</span>
                    <span class="transform -translate-y-2 inline-block relative">
                        夢
                    </span>
                    <span class="transform translate-y-1 inline-block">想</span>
                    <span class="inline-block">家</span>
                </h1>
            </div>

            <p class="text-xl md:text-2xl font-bold mt-4 mb-10 text-p-blue opacity-90 tracking-widest max-w-lg">
                用充滿溫度的手作料理，<br class="md:hidden"/>拼湊出你的美好藍圖。
            </p>

            <!-- 按鈕 -->
            <button class="btn-hover-effect hand-drawn-border bg-white px-10 py-4 text-2xl font-extrabold text-p-blue flex items-center gap-3 transition-all duration-300">
                開始探索
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </main>

    <!-- 特色區域 (延伸設計：溫馨的小卡片) -->
    <section class="w-full bg-white py-20 px-6 md:px-20 relative z-10 border-t-4 border-p-light-blue border-dashed">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-4xl font-extrabold text-center mb-16 relative inline-block left-1/2 transform -translate-x-1/2">
                我們的三大堅持
                <svg class="absolute -bottom-4 left-0 w-full" height="10" viewBox="0 0 100 10" preserveAspectRatio="none">
                    <path d="M0 5 Q 50 15 100 5" stroke="#FDE1A9" stroke-width="4" fill="transparent"/>
                </svg>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                <!-- 卡片 1 -->
                <div class="hand-drawn-border bg-p-bg p-8 flex flex-col items-center text-center transform transition-transform hover:-translate-y-2">
                    <div class="w-24 h-24 mb-6 rounded-full bg-white border-4 border-p-blue flex items-center justify-center relative">
                        <div class="absolute -top-2 -right-2 w-8 h-8 bg-p-yellow rounded-full -z-10"></div>
                        <!-- 手繪風鍋子 Icon -->
                        <svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="#82A3CB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 25 L40 25" />
                            <path d="M15 25 C15 40 35 40 35 25" fill="#C4D6ED" />
                            <path d="M25 15 L25 10 M20 18 L18 12 M30 18 L32 12" stroke="#FDE1A9"/>
                            <path d="M5 25 L10 25 M40 25 L45 25" />
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold mb-3">溫暖手作</h3>
                    <p class="font-bold opacity-80 leading-relaxed">每一份餐點都如同為家人準備般，充滿愛與細節，讓心靈和胃都獲得滿足。</p>
                </div>

                <!-- 卡片 2 -->
                <div class="hand-drawn-border bg-p-bg p-8 flex flex-col items-center text-center transform transition-transform hover:-translate-y-2 delay-100">
                    <div class="w-24 h-24 mb-6 rounded-full bg-white border-4 border-p-blue flex items-center justify-center relative">
                        <div class="absolute -bottom-2 -left-2 w-10 h-10 bg-p-light-blue rounded-full -z-10"></div>
                        <!-- 手繪風星星 Icon -->
                        <svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="#82A3CB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M25 5 L31 19 L46 21 L35 32 L38 46 L25 39 L12 46 L15 32 L4 21 L19 19 Z" fill="#FDE1A9"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold mb-3">點亮夢想</h3>
                    <p class="font-bold opacity-80 leading-relaxed">不只是填飽肚子，更希望成為你追夢路上的光芒，像螢火蟲般溫柔陪伴。</p>
                </div>

                <!-- 卡片 3 -->
                <div class="hand-drawn-border bg-p-bg p-8 flex flex-col items-center text-center transform transition-transform hover:-translate-y-2 delay-200">
                    <div class="w-24 h-24 mb-6 rounded-full bg-white border-4 border-p-blue flex items-center justify-center relative">
                        <div class="absolute top-0 left-0 w-full h-full bg-p-yellow rounded-full -z-10 transform translate-x-2 translate-y-2"></div>
                        <!-- 手繪風愛心 Icon -->
                        <svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="#82A3CB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M25 42 C25 42 5 28 5 16 C5 8 15 5 25 15 C35 5 45 8 45 16 C45 28 25 42 25 42 Z" fill="#C4D6ED"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold mb-3">分享喜悅</h3>
                    <p class="font-bold opacity-80 leading-relaxed">用美食連結彼此，在這裡，我們交換故事、分享快樂，創造深刻回憶。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁尾 Footer -->
    <footer class="w-full bg-p-bg py-8 text-center border-t-4 border-p-blue flex flex-col items-center gap-4">
        <div class="flex items-center gap-2 text-xl font-bold opacity-80">
            <svg width="24" height="24" viewBox="0 0 50 50" fill="none">
                <circle cx="25" cy="25" r="15" fill="#FDE1A9" opacity="0.8"/>
                <path d="M15 25C15 19 21 15 25 15C31 15 35 19 35 25" stroke="#82A3CB" stroke-width="4" stroke-linecap="round"/>
            </svg>
            食現夢想家 Food Dreamer
        </div>
        <p class="font-bold text-sm opacity-60">© 2026 食現夢想家. All rights reserved.</p>
    </footer>

</body>
</html>
